<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>VIP UK49s Analytics</title>
<style>
:root{
  --bg:#F7F7F5;--s:#FFFFFF;--s2:#F2F1EE;--s3:#EAEAE6;
  --b:#DEDCD6;--b2:#C8C5BC;
  --t:#111111;--t2:#555555;--t3:#999999;--t4:#BFBFBF;
  --v1:#0E7C6B;--v1l:#E6F7F4;--v1m:#50C9B5;--v1d:#0A5A4D;
  --v2:#3730A3;--v2l:#E8E7FD;--v2m:#7C76F3;--v2d:#1E195F;
  --v3:#C4173A;--v3l:#FDE8EC;--v3m:#F06B84;--v3d:#7A0E25;
  --am:#C27A0E;--aml:#FFF5E0;--amm:#F5C23D;--amd:#7A4D09;
  --gn:#0A7B4F;--gnl:#E3F8EF;--gnd:#064E32;
  --rd:#C72020;--rdl:#FDE8E8;--rdd:#7F1414;
  --pr:#6D28D9;--prl:#F0EBFE;
  --r:12px;--rs:8px;--rx:5px;
  --sh:0 1px 2px rgba(0,0,0,.03),0 2px 8px rgba(0,0,0,.04);
  --sh2:0 2px 4px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --sh3:0 4px 8px rgba(0,0,0,.05),0 16px 48px rgba(0,0,0,.08);
  --f:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;--m:'SF Mono','Fira Code','Cascadia Code','Consolas','Courier New',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--f);overflow:hidden;-webkit-font-smoothing:antialiased;background:var(--bg);color:var(--t)}
button{cursor:pointer;font-family:var(--f);border:none;background:none;transition:all .12s ease}
button:hover{opacity:.88}button:active{transform:scale(.98)}
button:disabled{opacity:.3;cursor:not-allowed;transform:none}
input,textarea{font-family:var(--m);outline:none;border:none}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--b2);border-radius:99px}
@keyframes up{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(196,23,58,.2)}50%{box-shadow:0 0 0 6px rgba(196,23,58,0)}}
@keyframes slide{0%{background-position:0 0}100%{background-position:200% 0}}
@keyframes pulse-soft{0%,100%{opacity:1}50%{opacity:.6}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}

.sh{display:flex;flex-direction:column;height:100vh}
.nav{flex-shrink:0;background:var(--s);border-bottom:1px solid var(--b);position:relative;z-index:50}
.nav::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--v1),var(--amm),var(--v3),var(--v2m),var(--v1));background-size:200%;animation:slide 14s linear infinite}
.nav-in{display:flex;align-items:center;padding:0 16px;height:48px;gap:12px}
.ham{width:34px;height:34px;border-radius:var(--rs);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--s2);border:1px solid var(--b);flex-shrink:0}
.ham:hover{background:var(--s3);transform:none}
.ham span{display:block;width:14px;height:1.5px;background:var(--t);border-radius:2px;transition:all .2s}
.ham.open span:nth-child(1){transform:rotate(45deg) translate(2.5px,2.5px)}
.ham.open span:nth-child(2){opacity:0}
.ham.open span:nth-child(3){transform:rotate(-45deg) translate(3px,-3px)}
.n-mark{width:28px;height:28px;border-radius:7px;background:var(--t);display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;font-weight:800;font-family:var(--m);letter-spacing:-.5px}
.ct{flex:1;position:relative;overflow:hidden}
.pn{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;transition:opacity .18s,transform .18s}
.pn.h{opacity:0;pointer-events:none;transform:translateX(6px)}.pn.v{opacity:1;pointer-events:auto;transform:translateX(0)}

/* Sidebar */
.sbo{position:fixed;inset:0;background:rgba(0,0,0,.18);z-index:200;opacity:0;pointer-events:none;transition:opacity .22s;backdrop-filter:blur(4px)}
.sbo.open{opacity:1;pointer-events:auto}
.sb{position:fixed;top:0;left:0;bottom:0;width:252px;background:var(--s);border-right:1px solid var(--b);z-index:210;transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:4px 0 32px rgba(0,0,0,.1)}
.sb.open{transform:translateX(0)}
.sb-hd{padding:20px 16px 18px;border-bottom:1px solid var(--b);background:linear-gradient(135deg,var(--t) 0%,#333 100%);position:relative;overflow:hidden}
.sb-hd::before{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E")}
.sb-lb{font-size:10px;letter-spacing:1px;color:var(--t4);font-family:var(--m);font-weight:700;padding:16px 16px 4px;text-transform:uppercase}
.sb-sec{padding:3px 8px}
.sb-it{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;width:100%;text-align:left;font-size:11px;font-weight:500;color:var(--t2);background:transparent;margin-bottom:2px;transition:background .12s ease,color .12s ease,border-color .12s ease}
.sb-it:hover{background:var(--s2);color:var(--t);transform:none}
.sb-it.ac{background:var(--v2l);color:var(--v2);font-weight:700;box-shadow:none;border-left:2px solid var(--v2);padding-left:8px}
.sb-it.ac:hover{opacity:.95;transform:none}
.sb-it .si{font-size:14px;width:20px;text-align:center;flex-shrink:0;line-height:1}
.sb-ft{margin-top:auto;padding:14px 16px;border-top:1px solid var(--b);background:var(--s2)}
.sb-st{text-align:center;margin-bottom:8px;font-size:7.5px;letter-spacing:1.5px;font-family:var(--m);font-weight:700;padding:3px 0;color:var(--t3)}
.sb-btn{width:100%;padding:9px;border-radius:8px;font-size:10px;font-weight:700;letter-spacing:.3px;display:flex;align-items:center;justify-content:center;gap:5px;transition:opacity .15s ease}
.sb-btn:hover{transform:none;opacity:.85}
.sb-btn.pri{background:linear-gradient(135deg,#9333EA 0%,#4F46E5 100%);color:#fff;border:none;box-shadow:0 2px 10px rgba(147,51,234,.3)}
.sb-btn.sec{background:var(--s);color:var(--t2);border:1px solid var(--b)}

/* Login */
.lov{position:fixed;inset:0;background:rgba(17,17,17,.2);display:flex;align-items:center;justify-content:center;z-index:300;backdrop-filter:blur(16px)}
.lc{background:var(--s);border-radius:16px;padding:32px;width:300px;box-shadow:var(--sh3);border:1px solid var(--b);animation:up .2s ease}
.lc h2{text-align:center;font-size:15px;font-weight:800;margin:10px 0 2px}
.lc .sub{text-align:center;font-size:7px;color:var(--t3);letter-spacing:2px;font-family:var(--m);margin-bottom:18px}
.lc input{width:100%;background:var(--s2);border:1.5px solid var(--b);border-radius:var(--rs);padding:10px 12px;color:var(--t);font-size:13px;letter-spacing:3px;text-align:center;margin-bottom:5px;transition:border .15s}
.lc input:focus{border-color:var(--t);background:var(--s)}
.lc .er{color:var(--rd);font-size:8px;text-align:center;margin-bottom:6px;font-family:var(--m);min-height:12px}
.lc .bts{display:flex;gap:8px;margin-top:4px}
.lc .bts button{flex:1;padding:10px;border-radius:var(--rs);font-size:10px;font-weight:700}
.lc .be{background:var(--t);color:#fff}.lc .bc{background:var(--s2);color:var(--t2);border:1px solid var(--b)}
.lc .hn{text-align:center;font-size:7px;color:var(--t4);font-family:var(--m);margin-top:12px}

/* Components */
.cd{background:var(--s);border-radius:var(--r);padding:18px;margin-bottom:10px;box-shadow:var(--sh);border:1px solid var(--b)}
.hr{border-radius:var(--r);padding:18px 22px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;background:var(--s);border:1px solid var(--b);box-shadow:var(--sh)}
.hr h3{font-size:15px;font-weight:800;letter-spacing:-.3px}.hr p{font-size:9px;font-weight:600;color:var(--t3);font-family:var(--m);letter-spacing:.5px;margin-top:2px}
.inp{width:100%;background:var(--s2);border:1.5px solid var(--b);border-radius:var(--rx);padding:8px 12px;color:var(--t);font-size:11px;transition:border .15s}
.inp:focus{border-color:var(--t2);background:var(--s)}
.ch{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700;letter-spacing:.2px;font-family:var(--m);white-space:nowrap}
.pl{padding:5px 12px;border-radius:99px;font-size:10px;font-weight:700;border:1.5px solid var(--b);background:var(--s);color:var(--t2);cursor:pointer}
.pl.ac{background:var(--t);border-color:var(--t);color:#fff}
.bp{padding:8px 16px;border-radius:var(--rx);font-size:11px;font-weight:700;background:var(--t);color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.bo{padding:8px 16px;border-radius:var(--rx);font-size:11px;font-weight:700;background:var(--s);color:var(--t2);border:1.5px solid var(--b)}
.bsm{padding:6px 12px;font-size:10px}
.bdn{padding:6px 12px;border-radius:var(--rx);font-size:10px;font-weight:700;background:var(--rdl);color:var(--rd);border:1px solid #F5A5A5;min-height:36px;min-width:44px}
.bwr{padding:6px 12px;border-radius:var(--rx);font-size:10px;font-weight:700;background:var(--aml);color:var(--am);border:1px solid var(--amm);min-height:36px;min-width:44px}
.sb2{border-radius:var(--rs);padding:5px 10px;text-align:center;min-width:46px}
.sb2 .v{font-size:14px;font-weight:800;line-height:1.1}.sb2 .l{font-size:10px;font-weight:700;opacity:.55;letter-spacing:.5px;margin-top:1px;font-family:var(--m)}
.dv{display:flex;align-items:center;gap:8px;margin:12px 0 8px}
.dv span{font-size:10px;letter-spacing:1px;font-weight:700;font-family:var(--m);color:var(--t3)}.dv::before,.dv::after{content:'';height:1px;flex:1;background:var(--b)}
.tr{background:var(--s);border-bottom:1px solid var(--b);display:flex;padding:0 16px;overflow-x:auto}
.tb{padding:10px 14px;font-size:10px;font-weight:700;letter-spacing:.4px;background:transparent;color:var(--t3);border-bottom:2px solid transparent;white-space:nowrap}
.tb:hover{color:var(--t2);transform:none}.tb.tac{color:var(--t)}
.dr{background:var(--s);border-radius:var(--rs);padding:9px 12px;display:flex;align-items:center;gap:10px;margin-bottom:4px;border:1px solid var(--b);transition:box-shadow .12s}
.dr:hover{box-shadow:var(--sh)}
.pw{border-radius:var(--r);overflow:hidden;margin-bottom:10px;box-shadow:var(--sh);border:1px solid var(--b)}
.nb2{flex:1;min-width:100px;border-radius:var(--rs);padding:10px 12px;border:1.5px solid}
.tst{position:fixed;bottom:20px;right:20px;z-index:9999;padding:10px 16px;border-radius:var(--rs);font-size:11px;font-weight:700;font-family:var(--m);box-shadow:var(--sh2);animation:up .2s ease}
.sta{padding:7px 12px;font-size:10px;font-weight:700;letter-spacing:.5px;background:transparent;color:var(--t3);border-bottom:2px solid transparent}
.sta.sac{color:var(--v3);border-bottom-color:var(--v3)}

/* Home */
.h-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:18px}
.h-card{background:var(--s);border-radius:var(--r);padding:18px;border:1px solid var(--b);box-shadow:var(--sh);cursor:pointer;transition:all .15s}
.h-card:hover{box-shadow:var(--sh2);transform:translateY(-2px)}
.h-card .h-icon{font-size:24px;margin-bottom:10px}
.h-card .h-val{font-size:22px;font-weight:800;line-height:1}
.h-card .h-lbl{font-size:9px;font-weight:600;color:var(--t3);margin-top:4px;font-family:var(--m);letter-spacing:.5px}
.h-hot{display:flex;flex-wrap:wrap;gap:8px}
.h-hot-num{width:52px;height:52px;border-radius:var(--r);background:linear-gradient(135deg,var(--v3l) 0%,#FFE5EC 100%);border:1.5px solid var(--v3m);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(196,23,58,.08);transition:transform .15s ease,box-shadow .15s ease}
.h-hot-num:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(196,23,58,.15)}
.h-hot-num span:first-child{font-size:20px;font-weight:900;color:var(--v3);line-height:1}
.h-hot-num span:last-child{font-size:7px;color:var(--v3);font-family:var(--m);margin-top:2px;font-weight:600}

/* ═══ Visual polish layer ═══ */
.cd{transition:box-shadow .18s ease,border-color .18s ease}
.pw{transition:box-shadow .18s ease,transform .15s ease}
.pw:hover{box-shadow:0 4px 16px rgba(0,0,0,.08)}
.dr{transition:box-shadow .15s ease,border-color .15s ease,transform .12s ease}
.dr:hover{box-shadow:0 2px 8px rgba(0,0,0,.06);border-color:var(--b2)}
.bp{transition:transform .12s ease,box-shadow .15s ease,opacity .15s ease}
.bp:hover{box-shadow:0 3px 10px rgba(0,0,0,.15);transform:translateY(-1px)}
.bo{transition:all .12s ease}
.bo:hover{background:var(--s2);border-color:var(--b2);transform:none}
.pl{transition:all .12s ease}
.pl:hover{background:var(--s2);border-color:var(--b2);transform:none}
.pl.ac:hover{background:var(--t);opacity:.9}
.tb{transition:color .15s ease,border-color .2s ease}
.sta{transition:color .15s ease,border-color .2s ease}
.sb-it{transition:background .12s ease,color .12s ease}

/* Header gradient backdrop */
.hr{background:linear-gradient(135deg,var(--s) 0%,var(--s) 60%,var(--s2) 100%);position:relative;overflow:hidden}
.hr::before{content:'';position:absolute;top:0;right:0;width:120px;height:100%;background:radial-gradient(circle at 80% 50%,rgba(0,0,0,.02) 0%,transparent 70%);pointer-events:none}
.hr h3{position:relative;z-index:1}
.hr p{position:relative;z-index:1}

/* Number balls — subtle inner shadow on default */
.dr span[style*="border-radius"]{transition:transform .1s ease}

/* Smoother panel transitions */
.pn{transition:opacity .22s ease,transform .22s ease}

/* Tab bar refinement */
.tr{box-shadow:inset 0 -1px 0 var(--b),0 1px 0 var(--b)}
.tb,.sta{position:relative}
.tb.tac::before,.sta.sac::before{content:'';position:absolute;bottom:-2px;left:0;right:0;height:2px;background:currentColor;border-radius:2px 2px 0 0}

/* Sidebar item polish */
.sb-it.ac{box-shadow:0 2px 6px rgba(17,17,17,.18)}

/* Hamburger refinement */
.ham{transition:background .15s ease,border-color .15s ease}
.ham:hover{border-color:var(--b2)}

/* Animation refinements */
@keyframes fadeInUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.cd,.pw,.hr{animation:fadeInUp .25s ease backwards}

/* Stat box subtle hover */
.sb2{transition:transform .12s ease}
.sb2:hover{transform:translateY(-1px)}

/* Refined chip */
.ch{transition:all .12s ease}

/* Better selection feedback for inputs */
.inp:hover{border-color:var(--b2)}

/* Toast refinement */
.tst{backdrop-filter:blur(8px);animation:fadeInUp .25s ease}

/* Number ball hover (in cards) */
.pw [style*="border-radius:'50%'"]:hover,.dr [style*="border-radius:'50%'"]:hover{transform:scale(1.08)}

/* HOT number tile pulsing accent */
@keyframes hotPulse{0%,100%{border-color:var(--v3m)}50%{border-color:var(--v3)}}

.bdn,.bwr{min-height:36px;min-width:44px;display:inline-flex;align-items:center;justify-content:center}

/* ═══ Refinement layer ═══ */
/* Better typography hierarchy in page headers */
.hr h3{font-size:16px;letter-spacing:-.4px;line-height:1.2}
.hr p{margin-top:4px;line-height:1.4}

/* Card hover lift (subtle) */
.cd:hover{border-color:var(--b2)}

/* Pattern card header gets a soft inner glow */
.pw{transition:box-shadow .25s ease,transform .15s ease,border-color .2s ease}
.pw:hover{transform:translateY(-1px)}

/* Tab bar — cleaner indicator */
.tb.tac::before{height:2.5px;bottom:-1px}
.tb{transition:color .18s ease}

/* Number balls — refined depth */
.dr span[style*="50%"]{transition:transform .15s ease,box-shadow .15s ease}

/* Filter pills — better active state */
.pl.ac{box-shadow:0 2px 6px rgba(17,17,17,.2)}

/* Section spacing rhythm */
.cd+.cd{margin-top:0}
.hr+.cd,.hr+div>.cd:first-child{margin-top:0}

/* Chip improvements */
.ch{padding:3px 9px;font-size:8.5px}

/* Status pill refinement */
.sb2{padding:6px 12px}
.sb2 .v{font-size:15px;letter-spacing:-.3px}
.sb2 .l{font-size:6.5px;letter-spacing:1.2px}

/* Better empty state typography */
.cd[style*="textAlign:'center'"] div[style*="fontWeight"]{letter-spacing:.2px}

/* Focus rings for accessibility */
button:focus-visible{outline:2px solid var(--t);outline-offset:2px;border-radius:4px}
input:focus-visible{outline:2px solid var(--t2);outline-offset:0}

/* Smoother header gradient */
.hr{background:linear-gradient(135deg,var(--s) 0%,var(--s) 70%,rgba(242,241,238,.6) 100%)}

/* Better divider between major sections */
.cd{box-shadow:0 1px 3px rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.03)}
.cd:hover{box-shadow:0 2px 8px rgba(0,0,0,.05),0 2px 4px rgba(0,0,0,.04)}

/* Pattern row — better visual differentiation */
.dr{background:var(--s);border-radius:var(--rs)}
.dr:hover{background:var(--s)}

/* Subtler animation */
.cd,.pw,.hr{animation-duration:.3s}

/* Better tab bar background */
.tr{background:linear-gradient(180deg,var(--s) 0%,var(--s) 100%);padding:0 20px}
@keyframes toast-in{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes btn-busy{0%,100%{opacity:.65}50%{opacity:.3}}
.bo:disabled{animation:btn-busy 1.1s ease-in-out infinite;cursor:not-allowed;}
</style>
</head>
<body>
<div class="sh">
  <div class="nav"><div class="nav-in">
    <button class="ham" id="ham-btn" onclick="toggleSB()"><span></span><span></span><span></span></button>
    <div style="display:flex;align-items:center;gap:8px"><div class="n-mark">49</div><div><div style="font-size:12px;font-weight:800;color:var(--t)">UK49s Analytics</div></div></div>
    <div class="n-r" style="margin-left:auto;display:flex;align-items:center;gap:8px">
      <div class="n-pill off" id="mgr-pill" style="display:flex;align-items:center;gap:4px;padding:4px 10px;border-radius:99px;font-size:10px;font-weight:700;letter-spacing:.5px;font-family:var(--m);border:1px solid var(--b);color:var(--t3)"><i style="width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0"></i><span id="mgr-txt">GUEST</span></div>
      <span id="nav-label" style="font-size:8px;font-weight:700;letter-spacing:1px;font-family:var(--m);color:var(--t3)">HOME</span>
    </div>
  </div></div>
  <div class="ct">
    <div id="pn-home" class="pn v"></div>
    <div id="pn-draws" class="pn h"></div>
    <div id="pn-v1" class="pn h"></div>
    <div id="pn-v2" class="pn h"></div>
    <div id="pn-v3" class="pn h"></div>
    <div id="pn-repeats" class="pn h"></div>
    <div id="pn-pairs" class="pn h"></div>
    <div id="pn-posts" class="pn h"></div>
    <div id="pn-faq" class="pn h"></div>
    <div id="pn-bonus" class="pn h"></div>
    <div id="pn-sameday" class="pn h"></div>
    <div id="pn-calc" class="pn h"></div>
  </div>
</div>
<div class="sbo" id="sb-ov" onclick="toggleSB()"></div>
<div class="sb" id="sb">
  <div class="sb-hd">
    <div style="display:flex;align-items:center;gap:12px;position:relative;z-index:1">
      <div style="width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.15);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">👑</div>
      <div>
        <div style="font-size:12px;font-weight:800;color:#fff;letter-spacing:-.2px;line-height:1.2">VIP UK49s Analytics</div>
        <div style="font-size:6px;color:rgba(255,255,255,.5);letter-spacing:2.5px;font-family:var(--m);font-weight:700;margin-top:3px">TRIPLE ENGINE</div>
      </div>

        var liveSeq=buildBonusSeqCards(draws,sp);
        var liveFam=buildBonusFamCards(draws,fp);
        var liveV2=buildBonusV2Cards(draws,vp);
        var nums=new Set();
        [liveSeq,liveFam,liveV2].forEach(function(arr){
          arr.forEach(function(c){
            (c.addPreds||[]).forEach(function(n){nums.add(n);});
            (c.subPreds||[]).forEach(function(n){nums.add(n);});
          });
        });
        var snap={
          ts:Date.now(),
          nums:Array.from(nums).sort(function(a,b){return a-b;}),
          drawsCount:draws.length,
          lastDrawDate:(sortD(draws).slice(-1)[0]||{}).date||null,
          lastDrawType:(sortD(draws).slice(-1)[0]||{}).drawType||null
        };
        var snaps=sGet('uk49s-bonus-snaps')||[];
        snaps.push(snap);
        if(snaps.length>200)snaps=snaps.slice(-200); /* keep last 200 snapshots */
        sSet('uk49s-bonus-snaps',snaps);
      }catch(err){}
      sBusy(false);fl('Analysis complete');
    },80);
  }
  function mMiss(id,type){
    var ar=type==='seq'?seqPats:type==='fam'?famPats:v2Pats;
    var fn=type==='seq'?sSP:type==='fam'?sFP:sVP;
    var k='uk49s-bonus-'+(type==='v2'?'v2':type);
    var nv=ar.map(function(p){if(p.id!==id)return p;var f=(p.failures||0)+1;return Object.assign({},p,{failures:f,status:f>=SC.MAX_FAIL?'failed':p.status});});
    fn(nv);sSet(k,nv);fl('Miss recorded');
  }
  function delPat(id,type){
    var ar=type==='seq'?seqPats:type==='fam'?famPats:v2Pats;
    var fn=type==='seq'?sSP:type==='fam'?sFP:sVP;
    var k='uk49s-bonus-'+(type==='v2'?'v2':type);
    fn(ar.filter(function(p){return p.id!==id;}));sSet(k,ar.filter(function(p){return p.id!==id;}));sDelConf(null);fl('Deleted');
  }

  var seqCards=um(function(){return buildBonusSeqCards(draws,seqPats);},[draws,seqPats]);
  var famCards=um(function(){return buildBonusFamCards(draws,famPats);},[draws,famPats]);
  var v2Cards=um(function(){return buildBonusV2Cards(draws,v2Pats);},[draws,v2Pats]);
  var allCards=um(function(){
    return seqCards.map(function(c){return Object.assign({},c,{_type:'seq'});})
      .concat(famCards.map(function(c){return Object.assign({},c,{_type:'fam'});}))
      .concat(v2Cards.map(function(c){return Object.assign({},c,{_type:'v2'});}))
      .sort(function(a,b){return b.streak-a.streak||b.totalHits-a.totalHits;});
  },[seqCards,famCards,v2Cards]);
  var allPats=um(function(){
    return seqPats.map(function(p){return Object.assign({},p,{_type:'seq'});})

    var srtD=sortD(draws);
    if(!srtD.length)return[];
    /* For each draw, find the most recent snapshot taken BEFORE that draw was added.
       The snapshot's lastDrawDate/lastDrawType tells us what data was in the system
       at snapshot time. A snapshot covers a future draw if that draw is later than
       the snapshot's lastDraw.                                                    */
    function drawOrder(d){return d.date+'|'+(d.drawType==='lunch'?'0':'1');}
    var results=[];
    for(var i=0;i<srtD.length;i++){
      var draw=srtD[i];
      var drawKey=drawOrder(draw);
      /* find the latest snapshot whose (lastDrawDate,lastDrawType) is strictly before this draw */
      var bestSnap=null;
      for(var s=snaps.length-1;s>=0;s--){
        var snap=snaps[s];
        if(!snap.lastDrawDate)continue;
        var snapKey=snap.lastDrawDate+'|'+(snap.lastDrawType==='lunch'?'0':'1');
        if(snapKey<drawKey){bestSnap=snap;break;}
      }
      if(!bestSnap)continue;
      var locked=bestSnap.nums||[];
      if(!locked.length)continue;
      var hitNum=locked.indexOf(draw.bonus)!==-1?draw.bonus:null;
      results.push({
        date:draw.date,
        type:draw.drawType,
        bonus:draw.bonus,
        hitNum:hitNum,
        hasHit:hitNum!==null,
        totalPreds:locked.length,
        lockedFromDate:bestSnap.lastDrawDate,
        lockedFromType:bestSnap.lastDrawType
      });
    }
    return results.reverse().slice(0,30);
  },[draws,seqPats,famPats,v2Pats]);

  function getRowPred(pt){

      var tN=lT.numbers.concat([lT.bonus]);
      n1=lN[pt.lp];n2=tN[pt.tp];
    }
    var sp=Math.abs(n1-n2);
    return{addPreds:bonusNums(n1+n2),subPreds:sp>=1?[sp]:[]};

              })))

  }

  return h('div',{style:{minHeight:'100vh',background:'var(--bg)'}},

    /* tab bar */

        return h('button',{key:i[0],className:'tb'+(tab===i[0]?' tac':''),style:tab===i[0]?{color:i[2],borderBottomColor:i[2]}:{},onClick:function(){sT(i[0]);}},i[1]);
      })),

    /* content */
    h('div',{style:{maxWidth:860,margin:'0 auto',padding:'20px 16px 80px'}},

      /* header */
      h('div',{className:'hr',style:{borderLeft:'3px solid var(--pr)',marginBottom:12}},
        h('div',null,
          h('h3',null,'\ud83c\udfb1 Bonus Tracker'),
          h('p',null,'V1 + V2 \u00b7 targets bonus ball only \u00b7 digit-shift ADD \u00b7 streak \u22651')),
        h('div',{style:{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap'}},
          h(Sb,{label:'PREDS',val:allCards.length,bg:'var(--prl)',fg:'var(--pr)'}),
          h(Sb,{label:'ACTIVE',val:aC,bg:'var(--s2)',fg:'var(--t2)'}),
          mgr&&h('button',{className:'bp bsm',style:{background:'var(--pr)',marginLeft:4,fontSize:9},onClick:runAnalysis,disabled:busy},busy?'...':'\u26a1 Run Analysis'))),

      /* ══ PREDICTIONS TAB ══ */
      tab==='predictions'&&h('div',null,

        /* all predicted numbers — deduplicated, one line */
        allCards.length>0&&h('div',{style:{background:'var(--s)',border:'1px solid rgba(109,40,217,0.25)',borderLeft:'3px solid var(--pr)',borderRadius:'var(--rs)',padding:'10px 14px',marginBottom:12,display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}},
          h('div',{style:{fontSize:8,fontWeight:700,letterSpacing:1.5,color:'var(--pr)',fontFamily:'var(--m)',flexShrink:0}},'ALL BONUS PREDS'),
          h('div',{style:{display:'flex',gap:6,flexWrap:'wrap',alignItems:'center'}},
            (function(){
              var seen=new Set(),nums=[];
              allCards.forEach(function(c){
                (c.addPreds||[]).forEach(function(n){if(!seen.has(n)){seen.add(n);nums.push(n);}});
                (c.subPreds||[]).forEach(function(n){if(!seen.has(n)){seen.add(n);nums.push(n);}});
              });
              return nums.sort(function(a,b){return a-b;}).map(function(n){
                return h(B,{key:n,n:n,bonus:true,sm:true});
              });
            })())),
        /* source draws */
        h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:12}},
          srcCard(lL,'lunch'),
          srcCard(lT,'tea')),

        /* prediction cards or empty state */
        allCards.length>0
          ?h('div',null,
              allCards.map(function(c){
                return h(BonusPredCard,{key:c.id,card:c,type:c._type,show:!!oh[c.id],onToggle:function(){sOh(function(s){var o=Object.assign({},s);o[c.id]=!o[c.id];return o;});}});
              }))

              h('div',{style:{fontSize:10,color:'var(--t3)',lineHeight:1.7,maxWidth:280,margin:'0 auto'}},mgr?'Tap \u26a1 Run Analysis to discover bonus patterns.':'Login then run analysis to discover bonus patterns.')),

              h('div',{style:{fontSize:13,fontWeight:800,color:'var(--pr)'}},' \ud83c\udfaf Bonus Performance'),

            h('div',{style:{display:'flex',alignItems:'center',gap:8}},

              h('button',{onClick:function(){sShowPerf(!showPerf);},style:{fontSize:9,fontWeight:700,fontFamily:'var(--m)',color:'var(--t3)',background:'none',border:'1px solid var(--b)',borderRadius:'var(--rx)',padding:'3px 9px',cursor:'pointer',letterSpacing:0.3}},showPerf?bonusHitsHist.length+' rows \u25be':'\u25b8 Show '+bonusHitsHist.length+' rows'))),

          /* collapsible body */
          showPerf&&h('div',null,
            bonusHitsHist.length>0&&h('div',{style:{display:'flex',alignItems:'center',gap:8,padding:'8px 12px',background:'rgba(109,40,217,0.06)',borderRadius:'var(--rx)',marginBottom:10,border:'1px solid rgba(109,40,217,0.18)'}},
              h('span',{style:{fontSize:12}},'\ud83d\udd12'),
              h('div',{style:{fontSize:8,color:'var(--pr)',fontFamily:'var(--m)',lineHeight:1.5,fontWeight:600}},'Predictions locked at end of previous day. A hit means the actual bonus was among the predicted numbers.')),
            bonusHitsHist.length>0
              ?h('div',{style:{display:'flex',flexDirection:'column',gap:4}},
                  bonusHitsHist.map(function(entry,i){

                            h('span',{style:{fontSize:16,color:'var(--v1)'}},'✓'),
                            h('div',null,
                              h('div',{style:{fontSize:9,fontWeight:800,color:'var(--pr)'}},'Bonus hit!'),
                              h('div',{style:{fontSize:8,color:'var(--pr)',fontFamily:'var(--m)'}},''+entry.hitNum+' was predicted')))
                        :h('span',{style:{fontSize:9,color:'var(--t4)',fontFamily:'var(--m)'}},'Bonus '+entry.bonus+' not in '+entry.totalPreds+' preds'));
                  }))

          h(Sb,{label:'RET',val:rC,bg:'var(--rdl)',fg:'var(--rdd)'})),
        h('div',{style:{display:'flex',gap:4,marginBottom:8,flexWrap:'wrap'}},
          [['all','ALL TYPES'],['seq','SEQ'],['fam','FAM'],['v2','CROSS']].map(function(tf){
            return h('button',{key:tf[0],className:'pl'+(typeFilter===tf[0]?' ac':''),onClick:function(){sTF(tf[0]);},style:{fontSize:8}},tf[1]);
          })),
        h('div',{style:{display:'flex',gap:4,marginBottom:12,flexWrap:'wrap'}},
          [['all','ALL',allPats.length],['active','ACT',aC],['warning','HOLD',wC],['failed','RET',rC]].map(function(pf){
            return h('button',{key:pf[0],className:'pl'+(patFilter===pf[0]?' ac':''),onClick:function(){sPF(pf[0]);},style:{fontSize:8}},pf[1]+' \u00b7 '+pf[2]);
          })),
        h(BonusLegend,null),
        visPats.map(function(pt){
          var hits=pt.history?pt.history.filter(function(x){return x.hit;}).length:0;
          var stk=pt.history?cW(pt.history):0,cf=pt.history?cF(pt.history):0;
          var stClr=pt.status==='active'?'var(--pr)':pt.status==='warning'?'var(--amm)':'var(--t4)';
          var isConf=delConf===pt.id;
          var typeLbl=pt._type==='seq'?'SEQ':pt._type==='fam'?'FAM':'CROSS';
          var typeBg=pt._type==='seq'?'var(--v1l)':pt._type==='fam'?'var(--v3l)':'var(--v2l)';
          var typeFg=pt._type==='seq'?'var(--v1)':pt._type==='fam'?'var(--v3)':'var(--v2)';
          var formulaStr;
          if(pt._type==='seq')formulaStr=drawLabel(pt.drawType)+' '+posLabel(pt.p1)+' \u00b1 '+posLabel(pt.p2);
          else if(pt._type==='fam')formulaStr=drawLabel(pt.drawType)+' (Recent) '+posLabel(pt.rp)+' \u00b1 '+drawLabel(pt.drawType)+' (Prev) '+posLabel(pt.pp);
          else formulaStr='Lunch '+posLabel(pt.lp)+' \u00b1 Tea '+posLabel(pt.tp);
          var rowPred=pt.status==='active'?getRowPred(pt):null;
          return h('div',{key:pt.id,className:'cd',style:{padding:'10px 12px',marginBottom:5,opacity:pt.status==='failed'?0.42:1,borderLeft:'3px solid '+stClr}},
            h('div',{style:{display:'flex',alignItems:'flex-start',gap:8,flexWrap:'wrap'}},
              h('div',{style:{flex:1,minWidth:0}},
                h('div',{style:{display:'flex',alignItems:'center',gap:5,flexWrap:'wrap',marginBottom:5}},
                  h(Ch,{bg:pt.status==='active'?'var(--prl)':pt.status==='warning'?'var(--aml)':'var(--rdl)',fg:pt.status==='active'?'var(--pr)':pt.status==='warning'?'var(--am)':'var(--rd)'},pt.status==='active'?'ACT':pt.status==='warning'?'HOLD':'RET'),
                  h(Ch,{bg:typeBg,fg:typeFg},typeLbl),
                  h('span',{style:{fontSize:11,fontWeight:700,fontFamily:'var(--m)',color:'var(--t)'}},formulaStr)),
                h('div',{style:{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}},
                  h(BonusMiniDots,{history:pt.history}),
                  stk>0&&h(Ch,{bg:'var(--prl)',fg:'var(--pr)'},'\ud83d\udd25'+stk),
                  h(Ch,null,'\u2605'+hits+'\u00d7'),
                  cf>0&&h(Ch,{bg:'var(--rdl)',fg:'var(--rd)'},'\u26a0'+cf))),
              h('div',{style:{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:5,flexShrink:0}},
                rowPred&&h(BonusPredBalls,{addPreds:rowPred.addPreds,subPreds:rowPred.subPreds}),
                mgr&&pt.status==='active'&&h('div',{style:{display:'flex',gap:3,alignItems:'center'}},
                  h('button',{className:'bwr',onClick:function(){mMiss(pt.id,pt._type);}},'MISS'),
                  isConf
                    ?h(React.Fragment,null,
                        h('button',{className:'bdn',onClick:function(){delPat(pt.id,pt._type);}},'SURE?'),
                        h('button',{onClick:function(){sDelConf(null);},style:{fontSize:8,color:'var(--t3)',background:'none',border:'none',cursor:'pointer',padding:'2px 4px'}},'cancel'))
                    :h('button',{className:'bdn',onClick:function(){sDelConf(pt.id);}},'DEL')))));
        }),
        !visPats.length&&h('div',{style:{textAlign:'center',padding:'40px',background:'var(--s)',borderRadius:'var(--r)',border:'1px solid var(--b)',color:'var(--t3)'}},
          h('div',{style:{fontSize:28}},'\ud83d\udd0d'),
          h('div',{style:{fontWeight:700,marginTop:6}},'No patterns match this filter')))),

    toast&&h(Tst,{msg:toast.msg,err:toast.err}));
}
ReactDOM.render(h(BonusTracker,null),document.getElementById('pn-bonus'));
})();

function Calc(){

  ue(function(){

  },[res,nextLunch,nextTea]);

  var nextL=nextLunch?nextLunch.numbers.concat([nextLunch.bonus]):[];

    var ltVer=!!sameDayTea;
    var ltAllP=res?res.lunch.s1.concat(res.lunch.s2).concat(res.lunch.s3):[];
    var ltHits=ltVer?ltAllP.filter(function(n){return ltNums.indexOf(n)!==-1;}).length:0;

    /* Source draw selector — Lunch only */
    var srcCard=h('div',{className:'cd',style:{borderLeft:'3px solid var(--am)',marginBottom:14}},
      h(Dv,{label:'\u2600 SELECT LUNCHTIME DRAW',c:'var(--am)'}),
      h('div',{style:{fontSize:8,color:'var(--t3)',fontFamily:'var(--m)',marginBottom:10,lineHeight:1.5}},
        'Pick any Lunchtime draw. Strategies S1, S2 and S3 run on it and predictions are checked against the same-day Teatime.'
      ),
      h(DList,{list:lDr,selId:selL?selL.id:null,onSel:function(id){pickSrc(id,'lunch');},empty:'No lunch draws yet',maxH:240}),
      selL&&h('div',{style:{marginTop:10,display:'flex',alignItems:'center',gap:6,padding:'8px 12px',background:'linear-gradient(90deg,var(--aml),var(--v2l))',border:'1px solid var(--v2m)',borderRadius:'var(--rx)'}},
        h('span',{style:{fontSize:11,lineHeight:1}},'\u2600\u2192\u263e'),
        h('div',{style:{fontSize:8,color:'var(--v2d)',fontFamily:'var(--m)',fontWeight:700,lineHeight:1.5}},
          'Using ',h('strong',null,selL.date+' Lunchtime'),
          sameDayTea?' \u00b7 same-day Tea found \u2714':' \u00b7 same-day Tea not in records yet'
        )
      )
    );

    /* Same-day Tea actual draw card */
    var teaCard=h('div',{style:{padding:'12px 14px',borderRadius:'var(--rs)',background:sameDayTea?'var(--v2l)':'var(--s2)',border:'1px solid '+(sameDayTea?'var(--v2m)':'var(--b)'),marginBottom:14}},
      h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:sameDayTea?8:0}},
        h('div',{style:{fontSize:10,fontWeight:800,color:sameDayTea?'var(--v2)':'var(--t3)',letterSpacing:.3}},'\u263e Same-Day Teatime'),
        sameDayTea&&ltVer&&h('div',{style:{background:'var(--gnl)',border:'1px solid #86EFAC',borderRadius:99,padding:'3px 10px',fontSize:8,fontWeight:800,color:'var(--gnd)',fontFamily:'var(--m)'}},'\u2714 '+ltHits+' HITS')
      ),
      sameDayTea
        ?h('div',null,
            h('div',{style:{fontSize:8,color:'var(--t3)',fontFamily:'var(--m)',marginBottom:6}},sameDayTea.date),
            h('div',{style:{display:'flex',gap:3,flexWrap:'wrap',alignItems:'center'}},
              sameDayTea.numbers.map(function(n,i){return h(CBall,{key:i,n:n,sm:true});}),
              h('span',{style:{width:1,height:14,background:'var(--v2m)',display:'inline-block',margin:'0 3px'}}),
              h(CBall,{n:sameDayTea.bonus,sm:true})
            )
          )
        :h('div',{style:{fontSize:9,color:'var(--t4)',fontFamily:'var(--m)',marginTop:6}},
            selL?'No same-day Tea for '+(selL?selL.date:'\u2014')+' in records yet \u2014 hits will appear automatically when added':'\u2014'
          )
    );

    /* Strategy rows */
    var stratRows=res
      ?h('div',{style:{borderRadius:'var(--rs)',overflow:'hidden',border:'1px solid var(--b)',boxShadow:'var(--sh)'}},
          h('div',{style:{background:'linear-gradient(90deg,var(--am) 0%,var(--v2) 100%)',padding:'12px 16px',display:'flex',alignItems:'center',justifyContent:'space-between'}},
            h('div',null,
              h('div',{style:{fontSize:13,fontWeight:800,color:'#fff',letterSpacing:.3}},'\u2600 Lunch \u2192 \u263e Tea'),
              h('div',{style:{fontSize:8,color:'rgba(255,255,255,.6)',marginTop:3,fontFamily:'var(--m)'}},selL?selL.date+' Lunchtime \u00b7 S1, S2, S3':'\u2014')
            ),
            ltVer&&h('div',{style:{background:'rgba(255,255,255,.22)',borderRadius:99,padding:'4px 12px',fontSize:9,fontWeight:800,color:'#fff',fontFamily:'var(--m)'}},ltHits+' HITS')
          ),
          h('div',{style:{background:'var(--s)',padding:'10px'}},
            h(SRow,{idx:1,preds:res.lunch.s1,sN:ltNums,oN:[],ver:ltVer}),
            h(SRow,{idx:2,preds:res.lunch.s2,sN:ltNums,oN:[],ver:ltVer}),
            h(SRow,{idx:3,preds:res.lunch.s3,sN:ltNums,oN:[],ver:ltVer})
          )
        )
      :null;

    var stratKey=h('div',{style:{display:'flex',gap:6,marginTop:14,padding:'8px 12px',background:'var(--s)',border:'1px solid var(--b)',borderRadius:'var(--rx)',flexWrap:'wrap'}},
      h('div',{style:{display:'flex',alignItems:'center',gap:5}},h('span',{style:{background:'var(--v1l)',color:'var(--v1)',padding:'2px 7px',borderRadius:3,fontFamily:'var(--m)',fontWeight:800,fontSize:8}},'S1'),h('span',{style:{fontSize:9,color:'var(--t3)'}},'Multiply & Offset')),
      h('div',{style:{display:'flex',alignItems:'center',gap:5}},h('span',{style:{background:'var(--aml)',color:'var(--am)',padding:'2px 7px',borderRadius:3,fontFamily:'var(--m)',fontWeight:800,fontSize:8}},'S2'),h('span',{style:{fontSize:9,color:'var(--t3)'}},'Subtract 5')),
      h('div',{style:{display:'flex',alignItems:'center',gap:5}},h('span',{style:{background:'var(--v2l)',color:'var(--v2)',padding:'2px 7px',borderRadius:3,fontFamily:'var(--m)',fontWeight:800,fontSize:8}},'S3'),h('span',{style:{fontSize:9,color:'var(--t3)'}},'Bonus +8 Chain'))
    );

    return h('div',null,
      h('div',{className:'hr',style:{borderLeft:'3px solid var(--v2)',marginBottom:14}},
        h('div',null,
          h('h3',null,'\u2600 \u2192 \u263e Lunch to Tea'),
          h('p',null,'Same-day prediction \u00b7 Lunchtime as source \u00b7 Teatime as target')
        )
      ),
      srcCard,
      teaCard,
      stratRows,
      stratKey
    );
  }

  function renderHow(){

    /* ── data ── */
    var lines=[
      {id:'s1l',strat:'S1',src:'Lunch',srcC:'var(--am)',lbl:'S1 \u2014 Lunch',predL:true, predT:false,pos:['P1','P2','P3','P4','P5','P6'],bonus:false},
      {id:'s1t',strat:'S1',src:'Tea',  srcC:'var(--v2)',lbl:'S1 \u2014 Tea',  predL:false,predT:true, pos:['P1','P2','P3','P4','P5','P6'],bonus:false},
      {id:'s2l',strat:'S2',src:'Lunch',srcC:'var(--am)',lbl:'S2 \u2014 Lunch',predL:true, predT:false,pos:['P1','P2','P3','P4','P5','P6'],bonus:false},
      {id:'s2t',strat:'S2',src:'Tea',  srcC:'var(--v2)',lbl:'S2 \u2014 Tea',  predL:false,predT:true, pos:['P1','P2','P3','P4','P5','P6'],bonus:false},
      {id:'s3l',strat:'S3',src:'Lunch',srcC:'var(--am)',lbl:'S3 \u2014 Lunch',predL:true, predT:false,pos:['BNS'],              bonus:true},
      {id:'s3t',strat:'S3',src:'Tea',  srcC:'var(--v2)',lbl:'S3 \u2014 Tea',  predL:false,predT:true, pos:['BNS'],              bonus:true},
      {id:'lt', strat:'L\u2192T',src:'Lunch',srcC:'var(--am)',lbl:'L\u2192T \u2014 Lunch',predL:false,predT:true, pos:['P1','P2','P3','P4','P5','P6','BNS'],bonus:false,cross:true}
    ];

    var stratColors={'S1':'var(--v1)','S2':'var(--am)','S3':'var(--v2)'};
    var stratBg    ={'S1':'var(--v1l)','S2':'var(--aml)','S3':'var(--v2l)'};
    var stratBd    ={'S1':'var(--v1m)','S2':'var(--amm)','S3':'var(--v2m)'};

    /* ── intro ── */
    var intro=h('div',{className:'cd',style:{marginBottom:14,borderLeft:'3px solid var(--v2)'}},
      h('div',{style:{fontSize:11,fontWeight:800,color:'var(--t2)',marginBottom:8,lineHeight:1.5}},'\ud83d\udccd This is a Position Tracker'),
      h('div',{style:{fontSize:9,color:'var(--t2)',lineHeight:1.8,marginBottom:10}},
        'Use this chart to check ',h('strong',null,'which line is predicting which draw'),', and to track ',h('strong',null,'which position within that line is predicting which draw'),'. ',
        'Each line runs a strategy against either the Lunchtime or the Teatime source draw. ',
        'Watch the positions \u2014 when a position consistently hits in a particular draw type, that is the one to follow.'
      ),
      h('div',{style:{display:'flex',gap:8,flexWrap:'wrap'}},
        h('div',{style:{display:'flex',alignItems:'center',gap:5,padding:'5px 10px',background:'var(--aml)',borderRadius:'var(--rx)',border:'1px solid var(--amm)'}},
          h('span',{style:{width:10,height:10,borderRadius:'50%',background:'var(--am)',display:'inline-block'}}),
          h('span',{style:{fontSize:8,fontWeight:700,color:'var(--amd)',fontFamily:'var(--m)'}},'LUNCH SOURCE')
        ),
        h('div',{style:{display:'flex',alignItems:'center',gap:5,padding:'5px 10px',background:'var(--v2l)',borderRadius:'var(--rx)',border:'1px solid var(--v2m)'}},
          h('span',{style:{width:10,height:10,borderRadius:'50%',background:'var(--v2)',display:'inline-block'}}),
          h('span',{style:{fontSize:8,fontWeight:700,color:'var(--v2d)',fontFamily:'var(--m)'}},'TEA SOURCE')
        ),
        h('div',{style:{display:'flex',alignItems:'center',gap:5,padding:'5px 10px',background:'var(--gnl)',borderRadius:'var(--rx)',border:'1px solid #86EFAC'}},
          h('span',{style:{fontSize:10,lineHeight:1}},'\u2714'),
          h('span',{style:{fontSize:8,fontWeight:700,color:'var(--gnd)',fontFamily:'var(--m)'}},'PREDICTS THAT DRAW')
        )
      )
    );

    /* ── Line → Draw table ── */
    var thStyle={padding:'6px 8px',fontWeight:800,fontSize:8,letterSpacing:.8,fontFamily:'var(--m)',borderBottom:'2px solid var(--b)',textAlign:'center',whiteSpace:'nowrap',color:'var(--t3)'};
    var tdStyle={padding:'7px 8px',fontSize:9,textAlign:'center',borderBottom:'1px solid var(--b)'};

    var lineHead=h('tr',null,
      h('th',{style:Object.assign({},thStyle,{textAlign:'left'})},'LINE'),
      h('th',{style:thStyle},'STRATEGY'),
      h('th',{style:thStyle},'SOURCE'),
      h('th',{style:thStyle},'PREDICTS LUNCH'),
      h('th',{style:thStyle},'PREDICTS TEA')
    );

    var lineRows=lines.map(function(ln,i){
      var sc=ln.cross?'var(--v2)':stratColors[ln.strat];
      var sb=ln.cross?'var(--v2l)':stratBg[ln.strat];
      var sbd=ln.cross?'var(--v2m)':stratBd[ln.strat];
      var stratLabel=ln.cross
        ?h('span',{style:{background:'linear-gradient(90deg,var(--aml),var(--v2l))',color:'var(--v2)',border:'1px solid var(--v2m)',padding:'2px 8px',borderRadius:3,fontSize:8,fontWeight:800,fontFamily:'var(--m)'}},'L\u2192T')
        :h('span',{style:{background:sb,color:sc,border:'1px solid '+sbd,padding:'2px 8px',borderRadius:3,fontSize:8,fontWeight:800,fontFamily:'var(--m)'}},ln.strat);
      return h('tr',{key:ln.id,style:{background:i%2?'var(--s)':'var(--s2)'}},
        h('td',{style:Object.assign({},tdStyle,{textAlign:'left',fontWeight:700,color:sc})},ln.lbl),
        h('td',{style:tdStyle},stratLabel),
        h('td',{style:tdStyle},h('span',{style:{background:ln.srcC==='var(--am)'?'var(--aml)':'var(--v2l)',color:ln.srcC,border:'1px solid '+(ln.srcC==='var(--am)'?'var(--amm)':'var(--v2m)'),padding:'2px 8px',borderRadius:3,fontSize:8,fontWeight:800,fontFamily:'var(--m)'}},ln.src.toUpperCase())),
        h('td',{style:tdStyle},ln.predL?h('span',{style:{fontSize:14,color:'var(--gn)',fontWeight:900}},'\u2714'):h('span',{style:{fontSize:12,color:'var(--b)'}},'\u2014')),
        h('td',{style:tdStyle},ln.predT?h('span',{style:{fontSize:14,color:'var(--gn)',fontWeight:900}},'\u2714'):h('span',{style:{fontSize:12,color:'var(--b)'}},'\u2014'))
      );
    });

    var lineTable=h('div',{className:'cd',style:{marginBottom:14}},
      h('div',{style:{fontSize:9,fontWeight:800,color:'var(--t2)',letterSpacing:.8,fontFamily:'var(--m)',marginBottom:10}},'LINE \u2192 DRAW TRACKER'),
      h('div',{style:{fontSize:9,color:'var(--t3)',marginBottom:10,lineHeight:1.6}},'Each line below is a strategy applied to a specific source draw. The tick shows which draw type that line\u2019s predictions are aimed at.'),
      h('div',{style:{overflowX:'auto'}},
        h('table',{style:{width:'100%',borderCollapse:'collapse'}},
          h('thead',null,lineHead),
          h('tbody',null,lineRows)
        )
      )
    );

    /* ── Position → Draw table ── */
    var posRows=[
      {pos:'P1',note:'1st drawn number',s1:'×2 + 0, wrap \u2192 same draw',s2:'\u22125, wrap \u2192 same draw',s3:'\u2014'},
      {pos:'P2',note:'2nd drawn number',s1:'×2 + 1, wrap \u2192 same draw',s2:'\u22125, wrap \u2192 same draw',s3:'\u2014'},
      {pos:'P3',note:'3rd drawn number',s1:'×2 + 2, wrap \u2192 same draw',s2:'\u22125, wrap \u2192 same draw',s3:'\u2014'},
      {pos:'P4',note:'4th drawn number',s1:'×2 + 3, wrap \u2192 same draw',s2:'\u22125, wrap \u2192 same draw',s3:'\u2014'},
      {pos:'P5',note:'5th drawn number',s1:'×2 + 4, wrap \u2192 same draw',s2:'\u22125, wrap \u2192 same draw',s3:'\u2014'},
      {pos:'P6',note:'6th drawn number',s1:'×2 + 5, wrap \u2192 same draw',s2:'\u22125, wrap \u2192 same draw',s3:'\u2014'},
      {pos:'BNS',note:'Bonus ball',       s1:'\u2014',s2:'\u2014',s3:'digit-sum \u2192 +8 chain'}
    ];

    var posHead=h('tr',null,
      h('th',{style:Object.assign({},thStyle,{textAlign:'left'})},'POSITION'),
      h('th',{style:Object.assign({},thStyle,{textAlign:'left'})},'BALL'),
      h('th',{style:Object.assign({},thStyle,{color:'var(--v1d)'})},'S1 PREDICTS'),
      h('th',{style:Object.assign({},thStyle,{color:'var(--amd)'})},'S2 PREDICTS'),
      h('th',{style:Object.assign({},thStyle,{color:'var(--v2d)'})},'S3 PREDICTS')
    );

    var posRowEls=posRows.map(function(r,i){
      return h('tr',{key:i,style:{background:i%2?'var(--s)':'var(--s2)'}},
        h('td',{style:Object.assign({},tdStyle,{textAlign:'left',fontWeight:700,color:'var(--t2)',fontFamily:'var(--m)'})},r.pos),
        h('td',{style:Object.assign({},tdStyle,{textAlign:'left',fontSize:8,color:'var(--t3)'})},r.note),
        h('td',{style:Object.assign({},tdStyle,{fontSize:8,color:'var(--v1d)'})},r.s1),
        h('td',{style:Object.assign({},tdStyle,{fontSize:8,color:'var(--amd)'})},r.s2),
        h('td',{style:Object.assign({},tdStyle,{fontSize:8,color:'var(--v2d)'})},r.s3||'\u2014')
      );
    });

    var posTable=h('div',{className:'cd',style:{marginBottom:14}},
      h('div',{style:{fontSize:9,fontWeight:800,color:'var(--t2)',letterSpacing:.8,fontFamily:'var(--m)',marginBottom:10}},'POSITION \u2192 DRAW TRACKER'),
      h('div',{style:{fontSize:9,color:'var(--t3)',marginBottom:10,lineHeight:1.6}},
        'Track each ball position across all three strategies. ',
        'When a position in a specific line consistently lands in a draw, mark it as your go-to position for that draw type.'
      ),
      h('div',{style:{overflowX:'auto'}},
        h('table',{style:{width:'100%',borderCollapse:'collapse'}},
          h('thead',null,posHead),
          h('tbody',null,posRowEls)
        )
      )
    );

    /* ── How to use tip ── */
    var tips=[
      {icon:'\ud83d\udd0d',title:'Spot the line',body:'Look at the Calculator results and note which line (S1-Lunch, S2-Tea, etc.) produced a number that appeared in the actual next draw.'},
      {icon:'\ud83d\udccd',title:'Note the position',body:'Within that line, identify which position (P1\u2013P6 or Bonus) the hit came from. Positions that hit repeatedly are the ones to watch.'},
      {icon:'\ud83d\udcc8',title:'Build your pattern',body:'Over time you will see that certain positions in certain lines favour a specific draw type. Follow those positions as your primary predictions.'}
    ];

    var tipCard=h('div',{className:'cd'},
      h('div',{style:{fontSize:9,fontWeight:800,color:'var(--t2)',letterSpacing:.8,fontFamily:'var(--m)',marginBottom:12}},'HOW TO USE THIS TRACKER'),
      tips.map(function(t,i){
        return h('div',{key:i,style:{display:'flex',gap:10,alignItems:'flex-start',marginBottom:i<tips.length-1?12:0}},
          h('div',{style:{fontSize:20,lineHeight:1,flexShrink:0}},t.icon),
          h('div',null,
            h('div',{style:{fontSize:9,fontWeight:800,color:'var(--t2)',marginBottom:3}},t.title),
            h('div',{style:{fontSize:9,color:'var(--t3)',lineHeight:1.7}},t.body)
          )
        );
      })
    );

    return h('div',null,
      h('div',{className:'hr',style:{borderLeft:'3px solid var(--v2)',marginBottom:14}},
        h('div',null,
          h('h3',null,'\ud83d\udccd Position Tracker'),
          h('p',null,'Which line predicts which draw \u00b7 which position to follow')
        )
      ),
      intro,
      lineTable,
      posTable,
      tipCard
    );
  }

  /* ── main render ── */
  return h('div',{style:{minHeight:'100vh',background:'var(--bg)'}},
    h('div',{className:'tr'},
      h('button',{className:'tb'+(tab==='calc'?' tac':''),style:tab==='calc'?{color:'var(--v2)',borderBottomColor:'var(--v2)'}:{},onClick:function(){sTab('calc');}},'CALCULATOR'),
      h('button',{className:'tb'+(tab==='lt'?' tac':''),style:tab==='lt'?{color:'var(--am)',borderBottomColor:'var(--am)'}:{},onClick:function(){sTab('lt');}},'\u2600\u2192\u263e LUNCH \u00b7 TEA'),
      h('button',{className:'tb'+(tab==='track'?' tac':''),style:tab==='track'?{color:'var(--v1)',borderBottomColor:'var(--v1)'}:{},onClick:function(){sTab('track');}},'\ud83d\udcca TRACKER'),
      h('button',{className:'tb'+(tab==='how'?' tac':''),style:tab==='how'?{color:'var(--t2)',borderBottomColor:'var(--t2)'}:{},onClick:function(){sTab('how');}},'HOW IT WORKS')
    ),
    h('div',{style:{maxWidth:900,margin:'0 auto',padding:'20px 16px 80px'}},
      h('div',{className:'hr',style:{borderLeft:'3px solid var(--v2)',marginBottom:14}},
        h('div',null,
          h('h3',null,'\ud83e\uddee Prediction Calculator'),
          h('p',null,'3 strategies \u00b7 reads from Draws page \u00b7 wrap-around arithmetic')
        ),
        h('div',{style:{display:'flex',gap:6}},
          h(Sb,{label:'DRAWS',val:allDraws.length,bg:'var(--aml)',fg:'var(--amd)'}),
          h(Sb,{label:'STRATEGIES',val:3,bg:'var(--v2l)',fg:'var(--v2d)'})
        )
      ),
      tab==='calc'&&renderCalc(),
      tab==='lt'&&renderLT(),
      tab==='track'&&renderTracker(),
      tab==='how'&&renderHow()
    ),
    toast&&h(Tst,{msg:toast.msg,err:toast.err})
  );
}

ReactDOM.render(h(Calc,null),document.getElementById('pn-calc'));
})();
</script>
</body>
</html>
